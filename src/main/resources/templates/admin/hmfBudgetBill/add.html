<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('拨付核签单立单')"/>
</head>
<body>
<form class="layui-form">
    <div class="mainBox">
        <div class="main-container">
            <div class="layui-form-item">
                <label class="layui-form-label">核签单号</label>
                <div class="layui-input-block">
                    <input type="text" name="billNo" autocomplete="off" placeholder="留空则自动编号" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">所属小区底册</label>
                <div class="layui-input-inline" style="width: 300px;">
                    <select name="siteId" lay-verify="required" lay-filter="site">
                        <option value="">请选在册底册</option>
                        <option th:each="a : ${archs}" th:value="${a.id}"
                                th:text="${a.siteNo} + '｜' + ${a.siteName}"></option>
                    </select>
                </div>
                <label class="layui-form-label" style="width: 90px;">核签年度</label>
                <div class="layui-input-inline">
                    <input type="number" name="billYear" lay-verify="required" autocomplete="off" placeholder="如 2026" class="layui-input">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">审定额线</label>
                <div class="layui-input-inline" style="width: 220px;">
                    <select name="ruleCode" lay-verify="required" lay-filter="rule">
                        <option value="">请选现行额线</option>
                        <option th:each="l : ${lines}" th:value="${l.ruleCode}"
                                th:text="${l.ruleCode} + '｜' + ${l.ruleName}"></option>
                    </select>
                </div>
                <label class="layui-form-label" style="width: 110px;">取数输入</label>
                <div class="layui-input-inline">
                    <input type="number" step="0.01" name="payInput" lay-verify="required" autocomplete="off"
                           placeholder="送额线判档的数" class="layui-input">
                </div>
                <div class="layui-input-inline" style="width: 170px;">
                    <input type="text" id="payAmtView" readonly placeholder="拨付额（只显不录）"
                           class="layui-input" style="background:#f2f2f2;font-weight:bold;">
                </div>
                <button type="button" class="pear-btn pear-btn-md" id="btnPayAmt">取审定拨付额</button>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label">立单经手人</label>
                <div class="layui-input-block">
                    <input type="text" name="drafter" th:value="${drafter}" readonly
                           class="layui-input" style="background:#f2f2f2;">
                    <div style="color:#999;font-size:12px;line-height:20px;">
                        前一格：立单经手人从起单到归档一路跟着这张单，重录几遍都不换；后续实际操作人另记在系统操作格里。
                    </div>
                </div>
            </div>

            <fieldset class="layui-elem-field" style="margin-top:10px;">
                <legend>三档点名（算法建单定死：业委会两笔凑齐，事务所一笔即可，中心一笔即可）</legend>
                <div class="layui-form-item" style="margin-top:10px;">
                    <label class="layui-form-label">业委会（2人）</label>
                    <div class="layui-input-inline">
                        <input type="text" name="ownerA" lay-verify="required" autocomplete="off" placeholder="点名人一" class="layui-input">
                    </div>
                    <div class="layui-input-inline">
                        <input type="text" name="ownerB" lay-verify="required" autocomplete="off" placeholder="点名人二（两笔都落才算过）" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">事务所（1人）</label>
                    <div class="layui-input-inline">
                        <input type="text" name="officeName" lay-verify="required" autocomplete="off" placeholder="头一笔落地本档即过" class="layui-input">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label">中心（1人）</label>
                    <div class="layui-input-inline">
                        <input type="text" name="centerName" lay-verify="required" autocomplete="off" placeholder="中心认下即封单" class="layui-input">
                    </div>
                </div>
            </fieldset>
        </div>
    </div>
    <div class="bottom">
        <div class="button-container">
            <button type="submit" class="layui-btn layui-btn-normal layui-btn-sm" lay-submit lay-filter="budget-save">
                <i class="layui-icon layui-icon-ok"></i>
                立单
            </button>
            <button type="reset" class="layui-btn layui-btn-primary layui-btn-sm">
                <i class="layui-icon layui-icon-refresh"></i>
                重置
            </button>
        </div>
    </div>
</form>
<th:block th:include="include :: footer"/>
<script>
    layui.use(['form', 'jquery'], function () {
        let form = layui.form;
        let $ = layui.jquery;
        let MODULE_PATH = rootPath + "/hmfBudgetBill";

        // 拨付额从审定额取：屏显与库存同一回算，这里只预览，不能手填
        $('#btnPayAmt').on('click', function () {
            let ruleCode = $('select[name=ruleCode]').val();
            let payInput = $('input[name=payInput]').val();
            if (!ruleCode || !payInput) {
                layer.msg('先选额线并填取数输入', {icon: 2});
                return;
            }
            $.get(MODULE_PATH + '/payAmount', {ruleCode: ruleCode, payInput: payInput}, function (res) {
                if (res.code === 200) {
                    $('#payAmtView').val(res.data + ' 元');
                } else {
                    $('#payAmtView').val('');
                    layer.msg(res.msg, {icon: 2});
                }
            }, 'json');
        });

        form.on('submit(budget-save)', function (data) {
            let f = data.field;
            $.ajax({
                url: MODULE_PATH + '/add',
                data: f,
                dataType: 'json',
                type: 'post',
                success: function (result) {
                    if (result.code === 200) {
                        layer.msg(result.msg, {icon: 1, time: 1000}, function () {
                            parent.layer.close(parent.layer.getFrameIndex(window.name));
                            parent.layui.table.reload("budget-table");
                        });
                    } else {
                        layer.msg(result.msg, {icon: 2, time: 2500});
                    }
                }
            });
            return false;
        });
    });
</script>
</body>
</html>
